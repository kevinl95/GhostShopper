[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostshopper"
version = "0.1.0"
description = "Brings Amazon Dash buttons back: press detected on the LAN, price quoted by push, bought on approval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
# Installed on the Raspberry Pi image: listener, agent service, CLI.
pi = [
    "scapy>=2.5,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27,<1",
    "boto3>=1.35",
]
# Packaged into the AgentCore Runtime zip (cloud side only).
buyer = [
    "nova-act",
    "bedrock-agentcore>=1.0",
    "boto3>=1.35",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
undash = "ghostshopper.cli.main:main"
undash-listener = "ghostshopper.listener.main:main"
undash-agent = "ghostshopper.agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --disable-socket --allow-unix-socket"
filterwarnings = ["error::DeprecationWarning:ghostshopper.*"]

[tool.coverage.run]
source = ["ghostshopper"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Operator scripts print long prose lines.
"infra/spikes/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ghostshopper.rules.*", "ghostshopper.config.*"]
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "scapy", "scapy.*"]
ignore_missing_imports = true
